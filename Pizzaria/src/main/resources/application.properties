# Define uma nova porta limpa
server.port=8081
# Força o Spring a usar o banco virtual na memória
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Configurações adicionais e remoção de avisos do log
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.web.resources.static-locations=classpath:/static/


# Testes para o usuario
# Tempo padrão da sessão
# Cookie persistente (necessário para "manter conectado" sobreviver ao fechar o navegador)
# server.servlet.session.cookie.secure=true   # ative quando usar HTTPS
# Banco em ARQUIVO (não perde os dados ao reiniciar; importante para o funcionário "pendente")
spring.datasource.url=jdbc:h2:file:./data/pizzaria
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console