# ============================================================
#  PIZZARIA - CONFIGURAÇÃO
# ============================================================
server.port=8081
spring.web.resources.static-locations=classpath:/static/
spring.mvc.problemdetails.enabled=false

# ------------------------------------------------------------
#  BANCO DE DADOS (SQL Server, porta 1433)  <<< EDITE AQUI >>>
#  Estes valores são lidos por Pizzaria.connection.ConnectionFactory
# ------------------------------------------------------------
# Servidor e porta onde o SQL Server está rodando
pizzaria.db.servidor=localhost
pizzaria.db.porta=1433
# 1) NOME DO BANCO (ex.: PizzariaDB)
pizzaria.db.nome=PizzariaDB
# 2) USUÁRIO do SQL Server (ex.: pizzaria_user ou sa)
pizzaria.db.usuario=
# 3) SENHA do SQL Server
pizzaria.db.senha=
# ------------------------------------------------------------
#  Sessão (login "manter conectado" usa cookie de 14 dias)
# ------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# server.servlet.session.cookie.secure=true   # ative quando usar HTTPS
